openapi: 3.0.3
info:
  title: RentBD Mobile API
  version: 1.0.0
  description: Next-Generation House Rental Platform Backend API for Bangladesh (DRF
    + GeoDjango/PostGIS)
paths:
  /api/v1/admin/ai-spam-queue/:
    get:
      operationId: v1_admin_ai_spam_queue_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSpamReportList'
          description: ''
  /api/v1/admin/ai-spam-queue/{id}/resolve/:
    post:
      operationId: v1_admin_ai_spam_queue_resolve_create
      summary: Resolve AI Spam Report
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpamReportResolve'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SpamReportResolve'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SpamReportResolve'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpamReport'
          description: ''
  /api/v1/admin/analytics/demand-supply-heatmap/:
    get:
      operationId: v1_admin_analytics_demand_supply_heatmap_retrieve
      summary: Demand vs Supply Heatmap Telemetry
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Geospatial area metrics
  /api/v1/admin/finance/ledger/:
    get:
      operationId: v1_admin_finance_ledger_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminLedgerList'
          description: ''
  /api/v1/admin/geo-photos/:
    get:
      operationId: v1_admin_geo_photos_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGeoPhotoVerificationList'
          description: ''
  /api/v1/admin/geo-photos/{id}/verify/:
    post:
      operationId: v1_admin_geo_photos_verify_create
      summary: Verify Geo-Photo Coordinates
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoPhotoVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GeoPhotoVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GeoPhotoVerify'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoPhotoVerification'
          description: ''
  /api/v1/admin/nid-verifications/:
    get:
      operationId: v1_admin_nid_verifications_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNIDVerificationRequestList'
          description: ''
  /api/v1/admin/nid-verifications/{id}/approve/:
    post:
      operationId: v1_admin_nid_verifications_approve_create
      summary: Approve Landlord NID Verification
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NIDApprove'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NIDApprove'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NIDApprove'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NIDVerificationRequest'
          description: ''
  /api/v1/admin/nid-verifications/{id}/reject/:
    post:
      operationId: v1_admin_nid_verifications_reject_create
      summary: Reject Landlord NID / Flag Broker
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NIDReject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NIDReject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NIDReject'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NIDVerificationRequest'
          description: ''
  /api/v1/admin/overview-stats/:
    get:
      operationId: v1_admin_overview_stats_retrieve
      description: Fetches real-time platform KPIs, growth percentages, pending queues,
        and fair-rent health distributions.
      summary: Dashboard Overview & Analytics Aggregates
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverviewStats'
          description: ''
  /api/v1/admin/properties/:
    get:
      operationId: v1_admin_properties_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminPropertyList'
          description: ''
  /api/v1/admin/properties/{id}/status/:
    patch:
      operationId: v1_admin_properties_status_partial_update
      summary: Update Property Moderation Status
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPropertyStatusUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPropertyStatusUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPropertyStatusUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProperty'
          description: ''
  /api/v1/admin/users/:
    get:
      operationId: v1_admin_users_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
  /api/v1/admin/users/{id}/ban/:
    post:
      operationId: v1_admin_users_ban_create
      summary: Toggle Broker / Ban Status
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: v1_auth_change_password_create
      description: Updates authenticated user's account password.
      summary: Change Password
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Password changed successfully
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Authenticates existing user using mobile number and password, with
        optional active role selection.
      summary: Login with Mobile Number and Password
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Logged in successfully with JWT and Profile
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Logs out the user and invalidates the refresh token.
      summary: User Logout
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Logged out successfully
  /api/v1/auth/nid-verify/:
    post:
      operationId: v1_auth_nid_verify_create
      description: Submits National ID images and optional live selfie to verify landlord
        or tenant credentials.
      summary: Upload NID & Live Selfie for Verification (Anti-broker)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NIDVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NIDVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NIDVerify'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: NID documents received for verification
  /api/v1/auth/otp/request/:
    post:
      operationId: v1_auth_otp_request_create
      description: Generates and dispatches a 6-digit OTP to a Bangladeshi mobile
        number (+8801...).
      summary: Request OTP for Mobile Number (Bangladesh)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: OTP sent successfully
  /api/v1/auth/otp/verify/:
    post:
      operationId: v1_auth_otp_verify_create
      description: Verifies the 6-digit OTP, registers or logs in the user, and returns
        JWT tokens + user profile.
      summary: Verify OTP and Login / Register
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerify'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Login successful with JWT and User Profile
  /api/v1/auth/profile/:
    get:
      operationId: v1_auth_profile_retrieve
      description: Returns the verified profile and landlord/tenant status of the
        currently authenticated user.
      summary: Get Current User Profile
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: v1_auth_profile_partial_update
      description: Updates tenant/landlord profile details like occupation, workplace,
        family size, etc.
      summary: Update Current User Profile
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Creates a new account for a Tenant or Landlord with phone number,
        password, and profile.
      summary: Register New Account with Role (Tenant or Landlord)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: User registered successfully with JWT and Profile
  /api/v1/auth/role/switch/:
    post:
      operationId: v1_auth_role_switch_create
      description: Switches the user's active role between Tenant, Landlord, or Dual.
      summary: Switch Operational Role (Tenant <-> Landlord)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleSwitch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleSwitch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleSwitch'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/chat/calls/{id}/:
    patch:
      operationId: v1_chat_calls_partial_update
      description: Updates status of VoIP call (CONNECTED, ENDED, MISSED) and records
        duration in seconds.
      summary: Update Masked Call Session Status
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMaskedCallSessionUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMaskedCallSessionUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMaskedCallSessionUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Call session updated
  /api/v1/chat/rooms/:
    get:
      operationId: v1_chat_rooms_list
      description: Returns all active encrypted chat rooms for current tenant or landlord.
      summary: List User Chat Rooms (In-App Messaging)
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatRoom'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoom'
          description: ''
    post:
      operationId: v1_chat_rooms_create
      summary: Start or Open Chat Room for Property
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRoomCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatRoomCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatRoomCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoom'
          description: ''
  /api/v1/chat/rooms/{id}/call-token/:
    post:
      operationId: v1_chat_rooms_call_token_create
      description: Generates ephemeral Agora RTC audio calling token, masking both
        parties' real phone numbers.
      summary: In-App Masked Calling (VoIP Session Token)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Masked VoIP session token
  /api/v1/chat/rooms/{id}/messages/:
    get:
      operationId: v1_chat_rooms_messages_list
      summary: Get Chat Room Message History
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
          description: ''
    post:
      operationId: v1_chat_rooms_messages_create
      summary: Send In-App Chat Message
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessage'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
          description: ''
  /api/v1/inquiries/:
    post:
      operationId: v1_inquiries_create
      description: Tenant submits an inquiry with automatic snapshot of their verified
        profile credentials.
      summary: Submit Tenant Inquiry for Property
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InquiryCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InquiryCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'
          description: ''
  /api/v1/inquiries/{id}/status/:
    patch:
      operationId: v1_inquiries_status_partial_update
      description: Landlord accepts or declines tenant inquiry. Accepting unlocks
        chat and masked calling.
      summary: Accept or Decline Tenant Inquiry
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInquiryStatusUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInquiryStatusUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInquiryStatusUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'
          description: ''
  /api/v1/inquiries/landlord-inbox/:
    get:
      operationId: v1_inquiries_landlord_inbox_list
      description: Returns all tenant inquiries submitted for properties owned by
        the current landlord.
      summary: Tenant Screening Inbox (Landlord)
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inquiry'
          description: ''
  /api/v1/inquiries/visits/:
    get:
      operationId: v1_inquiries_visits_list
      description: Returns scheduled visits for tenant or landlord.
      summary: List Scheduled Visits (In-person & Video Tour)
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitBooking'
          description: ''
    post:
      operationId: v1_inquiries_visits_create
      summary: Schedule In-Person Visit or Live Video Tour
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitBookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitBookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitBookingCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitBooking'
          description: ''
  /api/v1/inquiries/visits/{id}/status/:
    patch:
      operationId: v1_inquiries_visits_status_partial_update
      summary: Update Visit Booking Status (Confirm / Cancel)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVisitBookingStatusUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVisitBookingStatusUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVisitBookingStatusUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitBooking'
          description: ''
  /api/v1/insights/area/:
    get:
      operationId: v1_insights_area_retrieve
      description: Returns aggregated ratings and community reviews for a neighborhood.
      summary: Crowdsourced Area Insights (Waterlogging, Gas Pressure, Safety)
      parameters:
      - in: query
