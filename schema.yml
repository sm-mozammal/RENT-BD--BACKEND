      operationId: v1_properties_saved_searches_alerts_list
      description: Returns real-time notifications for newly listed properties matching
        saved searches.
      summary: Instant Alerts for Saved Searches
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedSearchAlert'
          description: ''
  /api/v1/properties/saved-searches/alerts/{id}/read/:
    patch:
      operationId: v1_properties_saved_searches_alerts_read_partial_update
      summary: Mark Alert as Read
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Alert marked as read
  /api/v1/properties/services/book/:
    post:
      operationId: v1_properties_services_book_create
      summary: Book Affiliate Moving or Cleaning Service
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerServiceBooking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PartnerServiceBooking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PartnerServiceBooking'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: Service booking confirmation
  /api/v1/properties/services/partners/:
    get:
      operationId: v1_properties_services_partners_retrieve
      description: 'Returns list of verified partner services: Packers & Movers, Cleaners,
        Painters.'
      summary: Affiliate Services & Movers Partners
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Partner services catalog
